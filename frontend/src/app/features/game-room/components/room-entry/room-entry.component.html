<div class="entry-stage flex-grow-1 d-flex flex-column align-items-center justify-content-start text-center p-1 p-sm-2 p-md-3">
    <div class="card shadow-lg border-accent p-2 p-sm-3 p-md-4 w-100 text-start" style="max-width: 800px;">
        <h3 class="mb-3 fw-bold" style="color: var(--brand-blue);">
            {{ isCreating ? 'Create A New Room' : 'Ready to Join?' }}
        </h3>

        <!-- Login Suggestion for Guests -->
        <div *ngIf="isGuest"
            class="alert alert-info py-2 px-3 mb-3 d-flex align-items-center justify-content-between">
            <span class="small d-flex align-items-center"><i class="bi bi-info-circle me-2 fs-5"></i><span>Log in to save stats and play
                with friends!</span></span>
            <button type="button" class="btn btn-sm btn-outline-primary ms-3"
                (click)="goToLogin()">Login</button>
        </div>

        <div class="mb-3 text-start">
            <label for="playerNameInput" class="form-label fw-bold text-secondary">Your Display Name</label>
            <input #playerNameInput id="playerNameInput" type="text" 
                class="form-control form-control-lg fw-bold subtle-placeholder"
                [class.is-invalid]="showNameError"
                [(ngModel)]="promptPlayerName" (keyup.enter)="onSubmit()"
                (input)="showNameError = false"
                placeholder="e.g. Captain Awesome" autofocus>
            <div *ngIf="showNameError" class="invalid-feedback fw-bold">
                Please enter a name to join.
            </div>
            <p class="text-muted small mt-1" *ngIf="!showNameError">This is how other players will see you.</p>
        </div>

        <div class="mb-3 text-start mt-4">
            <label for="joinPlayer" id="joinAsLabel"
                class="form-label fw-bold text-secondary mb-3">Join As:</label>
            <div class="d-flex gap-2 gap-sm-3" role="radiogroup" aria-labelledby="joinAsLabel">
                <div class="flex-grow-1">
                    <input type="radio" class="btn-check" name="joinType" id="joinPlayer"
                        value="player" [(ngModel)]="joinType">
                    <label
                        class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center gap-1"
                        for="joinPlayer">
                        <i class="bi bi-phone-fill fs-4"></i>
                        <span class="fw-bold small">PLAYER</span>
                        <small class="opacity-75" style="font-size: 0.65rem;">Use your mobile phone</small>
                    </label>
                </div>
                <div class="flex-grow-1">
                    <input type="radio" class="btn-check" name="joinType" id="joinTable"
                        value="table" [(ngModel)]="joinType">
                    <label
                        class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center gap-1"
                        for="joinTable">
                        <i class="bi bi-display-fill fs-4"></i>
                        <span class="fw-bold small">TABLE</span>
                        <small class="opacity-75" style="font-size: 0.65rem;">Shared screen / TV</small>
                    </label>
                </div>
            </div>
        </div>

        <div *ngIf="isCreating" class="mb-3 text-start">
            <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" id="publicSwitch"
                    [(ngModel)]="isPublic">
                <label class="form-check-label fw-bold text-secondary" for="publicSwitch">
                    Public Room
                </label>
            </div>
        </div>

        <!-- Add Friends Section (Mock) -->
        <div class="mb-3 text-start border-top pt-3" *ngIf="!isGuest">
            <span class="form-label d-block fw-bold text-secondary mb-2">
                <i class="bi bi-people-fill me-2"></i> Invite Friends
            </span>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill">+ Invite
                    Friend</button>
            </div>
        </div>

        <button type="button" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm"
            (click)="onSubmit()">
            {{ isCreating ? 'CREATE ROOM' : 'ENTER ROOM' }}
        </button>
    </div>
</div>
