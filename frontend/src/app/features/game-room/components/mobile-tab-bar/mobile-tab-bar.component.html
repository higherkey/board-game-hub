<div class="mobile-tab-bar d-md-none d-flex justify-content-around align-items-center">
    <!-- Game Tab -->
    <button type="button" class="nav-btn d-flex align-items-center justify-content-center gap-2" [class.active]="activeTab === 'game'"
        (click)="selectTab('game')">
        <i class="bi bi-controller fs-4"></i>
        <span class="fw-bold">GAME</span>
    </button>

    <!-- Players Tab -->
    <button type="button" class="nav-btn d-flex align-items-center justify-content-center gap-2" [class.active]="activeTab === 'players'"
        (click)="selectTab('players')">
        <i class="bi bi-people-fill fs-4"></i>
        <span class="fw-bold">PLAYERS</span>
    </button>
</div>
