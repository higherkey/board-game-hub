<div class="container-fluid p-0 d-flex flex-column h-100">
    <!-- 1. HEADER (Top Bar) -->
    <app-room-header
        [isBigScreen]="isBigScreen"
        [roomCode]="roomCode"
        [isLobby]="(stateService.currentRoom$ | async)?.gameType === 'None'"
        [gameDisplayName]="getCurrentGameDisplayName((stateService.currentRoom$ | async)?.gameType)"
        [videoChatReady]="videoChatReady"
        [isVideoActive]="isVideoActive"
        [gameStarted]="(stateService.gameStarted$ | async) ?? false"
        [currentRound]="(stateService.currentRoom$ | async)?.roundNumber || 1"
        [totalRounds]="(stateService.currentRoom$ | async)?.totalRounds || (stateService.currentRoom$ | async)?.settings?.totalRounds || 5"
        [session]="stateService.session$ | async"
        [showUndoButton]="(stateService.gameStarted$ | async) !== null && (stateService.gameStarted$ | async) !== false && (stateService.currentRoom$ | async)?.gameType !== 'Babble'"
        (leaveRoom)="leaveRoom()"
        (startVideoChat)="videoChat?.joinVideo()"
        (requestUndo)="requestUndo()"
    ></app-room-header>

    <!-- UNDO TOAST OVERLAY -->
    <app-undo-toast *ngIf="(stateService.currentRoom$ | async)?.currentVote" [vote]="(stateService.currentRoom$ | async)?.currentVote"
        [currentUserId]="(stateService.connectionId$ | async) || ''"
        [totalPlayers]="(stateService.currentRoom$ | async)?.players?.length || 0">
    </app-undo-toast>

    <!-- 2. MAIN BODY (Sidebar + Content) -->
    <div class="d-flex flex-grow-1 position-relative section-container" [class.transitions-enabled]="enableTransitions">
        <!-- PLAYER SIDEBAR (Hidden during entry stage) -->
        <div *ngIf="!stateService.needsName" class="d-md-flex flex-column sidebar-panel"
            [class.is-collapsed]="isSidebarCollapsed" [class.d-flex]="mobileView === 'players'"
            [class.d-none]="mobileView !== 'players'">

            <app-room-sidebar
                [currentRoom]="stateService.currentRoom$ | async"
                [players]="getPlayers(stateService.players$ | async)"
                [tables]="getTables(stateService.players$ | async)"
                [connectionId]="(stateService.connectionId$ | async) || ''"
                (toggleSidebar)="toggleSidebar()"
                (changeRole)="changeRole($event)"
                (setHostPlayer)="onSetHostPlayer($event)"
                (removeHostPlayer)="onRemoveHostPlayer($event)">
            </app-room-sidebar>

            <!-- Video Chat Button / Status -->
            <div class="mt-3">
                <app-video-chat #videoChat (viewModeChange)="onVideoLayoutChange($event)" (isVideoActiveChange)="isVideoActive = $event"></app-video-chat>
            </div>
        </div>

        <!-- MAIN GAME STAGE -->
        <div class="main-stage-panel d-md-flex flex-column flex-grow-1 px-0"
            [ngClass]="{'w-100': stateService.needsName || isSidebarCollapsed}" 
            [class.d-flex]="mobileView === 'game'"
            [class.mobile-hidden]="mobileView !== 'game'" [class.has-docked-top]="videoLayout === 'docked-top'"
            [class.has-docked-bottom]="videoLayout === 'docked-bottom'">

            <div *ngIf="stateService.needsName || !(stateService.gameStarted$ | async)" class="main-stage flex-grow-1 bg-surface-2 position-relative d-flex flex-column">
                <!-- Floating Sidebar Expand (Desktop Only, only if collapsed) -->
                <button
                    class="btn btn-dark btn-sm position-absolute top-0 start-0 m-2 rounded-circle shadow opacity-50 hover-opacity-100 d-none floating-btn"
                    [class.d-md-block]="isSidebarCollapsed" (click)="toggleSidebar()"
                    title="Expand Sidebar">
                    <i class="bi bi-chevron-right"></i>
                </button>

                <!-- Floating Big Screen Toggle (Desktop Only) -->
                <button
                    class="btn btn-dark btn-sm position-absolute top-0 end-0 m-2 rounded-circle shadow opacity-50 hover-opacity-100 d-none d-md-block floating-btn"
                    (click)="toggleBigScreen($event)"
                    title="{{ isBigScreen ? 'Exit Big Screen (Shift+F)' : 'Big Screen Mode (Shift+F)' }}">
                    <i class="bi" [class.bi-fullscreen]="!isBigScreen" [class.bi-fullscreen-exit]="isBigScreen"></i>
                </button>
                <div class="flex-grow-1 d-flex flex-column">

                    <!-- ENTRY STAGE (Name / Room Creation) -->
                    <app-room-entry *ngIf="stateService.needsName" class="flex-grow-1"
                        [isCreating]="isCreating"
                        [isGuest]="!!(stateService.session$ | async)?.isGuest"
                        [initialName]="promptPlayerName"
                        (submitEntry)="submitEntry($event)"
                        (login)="goToLogin()">
                    </app-room-entry>

                    <!-- LOBBY STATE (Host Only Controls & Player Read-Only View) -->
                    <ng-container *ngIf="!stateService.needsName && !(stateService.gameStarted$ | async)">
                        <div class="row w-100 justify-content-center m-0 h-100 flex-grow-1">
                            <div class="col-12 px-0 h-100 d-flex flex-column lobby-container-max">
                                <!-- Host Only Controls -->
                                <div class="w-100 h-100 d-flex flex-column" *ngIf="stateService.isHost$ | async">
                                    <app-host-settings [roomCode]="roomCode"
                                        [currentGameType]="(stateService.currentRoom$ | async)?.gameType || ''"
                                        [players]="(stateService.players$ | async) || []" [isHost]="true"
                                        [meReady]="(stateService.me$ | async)?.isReady || false"
                                        [isScreen]="(stateService.me$ | async)?.isScreen || false"
                                        [isHostOverride]="(stateService.currentRoom$ | async)?.isHostOverride || false"
                                        (gameStart)="startGame($event)"
                                        (nextRound)="onNextRound($event)" (endGame)="onEndGame($event)" (exitGame)="onExitGame($event)"
                                        (toggleReady)="toggleReady($event)">
                                    </app-host-settings>
                                </div>

                                <!-- Player Read-Only View -->
                                <div class="w-100 h-100 d-flex flex-column" *ngIf="!(stateService.isHost$ | async)">
                                    <app-player-settings [roomCode]="roomCode" [room]="stateService.currentRoom$ | async"
                                        [selectedGame]="selectedGame" [meReady]="(stateService.me$ | async)?.isReady || false"
                                        [isScreen]="(stateService.me$ | async)?.isScreen || false" (toggleReady)="toggleReady($event)">
                                    </app-player-settings>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </div>
            <!-- ACTIVE GAME STATE -->
            <div *ngIf="!stateService.needsName && (stateService.gameStarted$ | async)" class="h-100 w-100 fade-in position-relative d-flex flex-column">

                <div class="flex-grow-1 position-relative overflow-hidden">
                    <ng-container *ngIf="stateService.gameComponent$ | async as component" 
                                  [ngComponentOutlet]="component" 
                                  [ngComponentOutletInputs]="(stateService.gameInputs$ | async) || {}">
                    </ng-container>

                    <!-- Fallback removed: All games should have explicit components now -->
                    <div *ngIf="!(stateService.gameComponent$ | async)"
                        class="h-100 d-flex flex-column align-items-center justify-content-center text-secondary">
                        <i class="bi bi-exclamation-triangle fs-1 mb-2"></i>
                        <p>Game component not found for {{ (stateService.currentRoom$ | async)?.gameType }}</p>
                    </div>
                </div>

                <!-- INTERMISSION SETTINGS BAR (Host Only - Desktop) -->
                <div *ngIf="(stateService.isIntermission$ | async) && (stateService.isHost$ | async)"
                    class="intermission-bar position-absolute bottom-0 start-0 w-100 p-3 border-top border-secondary d-none d-md-block intermission-bar-style">
                    <div class="container-fluid d-flex align-items-center justify-content-center">
                        <app-host-settings [roomCode]="roomCode" [compactMode]="true" [isIntermission]="true"
                            [currentGameType]="(stateService.currentRoom$ | async)?.gameType || ''"
                            [currentRound]="(stateService.currentRoom$ | async)?.roundNumber || 0"
                            [totalRounds]="(stateService.currentRoom$ | async)?.totalRounds || (stateService.currentRoom$ | async)?.settings?.totalRounds || 5"
                            [players]="(stateService.players$ | async) || []"
                            (nextRound)="onNextRound($event)" (endGame)="onEndGame($event)" (exitGame)="onExitGame($event)">
                        </app-host-settings>
                    </div>
                </div>

                <!-- HOST CONTROLS (Mobile Only - Bottom of Game View) -->
                <div class="d-md-none bg-surface border-top border-pink p-1 px-2" *ngIf="(stateService.isHost$ | async)">
                     <!-- Toggle for Host Controls if they take up too much space? For now, just show them as requested -->
                     <details class="mb-2">
                        <summary class="btn btn-outline-warning w-100 fw-bold d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-star-fill"></i> Host Controls
                        </summary>
                        <div class="mt-3 card shadow-sm border-warning">
                            <div class="card-body p-3">
                                <!-- Dynamic Host Controls from Active Game -->
                                <div *ngIf="activeGameComponent?.hostControlsTemplate" class="mb-3 border-bottom pb-3">
                                    <ng-container *ngTemplateOutlet="activeGameComponent.hostControlsTemplate"></ng-container>
                                </div>

                                <app-host-settings [roomCode]="roomCode" [compactMode]="true"
                                    [currentGameType]="(stateService.currentRoom$ | async)?.gameType || ''"
                                    [meReady]="(stateService.me$ | async)?.isReady || false" [isHost]="(stateService.isHost$ | async) || false"
                                    [isScreen]="(stateService.me$ | async)?.isScreen || false"
                                    [isHostOverride]="(stateService.currentRoom$ | async)?.isHostOverride || false"
                                    (gameStart)="startGame($event)"
                                    (nextRound)="onNextRound($event)" (endGame)="onEndGame($event)" (exitGame)="onExitGame($event)"
                                    (toggleReady)="toggleReady($event)">
                                </app-host-settings>
                            </div>
                        </div>
                     </details>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 3. MOBILE TAB BAR (Small Screens Only) -->
<app-mobile-tab-bar *ngIf="!stateService.needsName" [activeTab]="mobileView" [isHost]="(stateService.isHost$ | async) || false"
    (tabChange)="setMobileView($event)">
</app-mobile-tab-bar>
