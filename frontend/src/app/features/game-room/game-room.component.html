<div class="container-fluid d-flex flex-column h-100">
    <!-- 1. HEADER (Top Bar) -->
    <app-room-header
        [isBigScreen]="isBigScreen"
        [roomCode]="roomCode"
        [isLobby]="(currentRoom$ | async)?.gameType === 'None'"
        [gameDisplayName]="getCurrentGameDisplayName((currentRoom$ | async)?.gameType)"
        [videoChatReady]="videoChatReady"
        [isVideoActive]="isVideoActive"
        [gameStarted]="(gameStarted$ | async) ?? false"
        [currentRound]="(currentRoom$ | async)?.roundNumber || 1"
        [totalRounds]="(currentRoom$ | async)?.totalRounds || (currentRoom$ | async)?.settings?.totalRounds || 5"
        [session]="session$ | async"
        [showUndoButton]="(gameStarted$ | async) !== null && (gameStarted$ | async) !== false && (currentRoom$ | async)?.gameType !== 'Babble'"
        (leaveRoom)="leaveRoom()"
        (startVideoChat)="videoChat?.joinVideo()"
        (requestUndo)="requestUndo()"
    ></app-room-header>

    <!-- UNDO TOAST OVERLAY -->
    <app-undo-toast *ngIf="(currentRoom$ | async)?.currentVote" [vote]="(currentRoom$ | async)?.currentVote"
        [currentUserId]="getMyConnectionId((currentRoom$ | async)?.players)"
        [totalPlayers]="(currentRoom$ | async)?.players?.length || 0">
    </app-undo-toast>

    <!-- 2. MAIN BODY (Sidebar + Content) -->
    <div class="row flex-grow-1 g-3 position-relative section-container" [class.transitions-enabled]="enableTransitions">
        <!-- PLAYER SIDEBAR (Hidden during entry stage) -->
        <div *ngIf="!needsName" class="col-md-4 col-lg-3 d-md-flex flex-column flex-grow-1 sidebar-panel"
            [class.is-collapsed]="isSidebarCollapsed" [class.d-flex]="mobileView === 'players'"
            [class.d-none]="mobileView !== 'players'">

            <app-room-sidebar
                [currentRoom]="currentRoom$ | async"
                [players]="getPlayers(players$ | async)"
                [tables]="getTables(players$ | async)"
                [connectionId]="(connectionId$ | async) || ''"
                (toggleSidebar)="toggleSidebar()"
                (changeRole)="changeRole($event)"
                (setHostPlayer)="onSetHostPlayer($event)"
                (removeHostPlayer)="onRemoveHostPlayer($event)">
            </app-room-sidebar>

            <!-- Video Chat Button / Status -->
            <div class="mt-3">
                <app-video-chat #videoChat (viewModeChange)="onVideoLayoutChange($event)" (isVideoActiveChange)="isVideoActive = $event"></app-video-chat>
            </div>
        </div>

        <!-- MAIN GAME STAGE -->
        <div class="main-stage-panel d-md-flex flex-column flex-grow-1 px-0"
            [ngClass]="needsName ? 'col-12' : (isSidebarCollapsed ? 'col-md-12' : 'col-md-8 col-lg-9')" 
            [class.d-flex]="mobileView === 'game'"
            [class.mobile-hidden]="mobileView !== 'game'" [class.has-docked-top]="videoLayout === 'docked-top'"
            [class.has-docked-bottom]="videoLayout === 'docked-bottom'"
            style="min-height: 0;">

            <div class="main-stage flex-grow-1 bg-surface-2 rounded-4 position-relative d-flex flex-column" style="min-height: 0;">
                <!-- Floating Sidebar Expand (Desktop Only, only if collapsed) -->
                <button
                    class="btn btn-dark btn-sm position-absolute top-0 start-0 m-2 rounded-circle shadow opacity-50 hover-opacity-100 d-none"
                    [class.d-md-block]="isSidebarCollapsed" (click)="toggleSidebar()"
                    style="z-index: 1000; width: 32px; height: 32px; padding: 0;" title="Expand Sidebar">
                    <i class="bi bi-chevron-right"></i>
                </button>

                <!-- Floating Big Screen Toggle (Desktop Only) -->
                <button
                    class="btn btn-dark btn-sm position-absolute top-0 end-0 m-2 rounded-circle shadow opacity-50 hover-opacity-100 d-none d-md-block"
                    (click)="toggleBigScreen($event)" style="z-index: 1000; width: 32px; height: 32px; padding: 0;"
                    title="{{ isBigScreen ? 'Exit Big Screen (Shift+F)' : 'Big Screen Mode (Shift+F)' }}">
                    <i class="bi" [class.bi-fullscreen]="!isBigScreen" [class.bi-fullscreen-exit]="isBigScreen"></i>
                </button>
                <div class="flex-grow-1 d-flex flex-column">

                    <!-- ENTRY STAGE (Name / Room Creation) -->
                    <app-room-entry *ngIf="needsName" class="flex-grow-1"
                        [isCreating]="isCreating"
                        [isGuest]="!!(session$ | async)?.isGuest"
                        [initialName]="promptPlayerName"
                        (submitEntry)="submitEntry($event)"
                        (login)="goToLogin()">
                    </app-room-entry>

                    <!-- LOBBY STATE (Host Only Controls & Player Read-Only View) -->
                    <ng-container *ngIf="!needsName && !(gameStarted$ | async)">
                        <div class="row w-100 justify-content-center m-0">
                            <div class="col-12 px-0" style="max-width: 1200px;">
                                <!-- Host Only Controls -->
                                <div class="w-100" *ngIf="isHost$ | async">
                                    <app-host-settings [roomCode]="roomCode"
                                        [currentGameType]="(currentRoom$ | async)?.gameType || ''"
                                        [players]="(players$ | async) || []" [isHost]="true"
                                        [meReady]="(me$ | async)?.isReady || false"
                                        [isScreen]="(me$ | async)?.isScreen || false"
                                        [isHostOverride]="(currentRoom$ | async)?.isHostOverride || false"
                                        (gameStart)="startGame($event)"
                                        (nextRound)="onNextRound($event)" (endGame)="onEndGame($event)" (exitGame)="onExitGame($event)"
                                        (toggleReady)="toggleReady($event)">
                                    </app-host-settings>
                                </div>

                                <!-- Player Read-Only View -->
                                <div class="w-100" *ngIf="!(isHost$ | async)">
                                    <app-player-settings [roomCode]="roomCode" [room]="currentRoom$ | async"
                                        [selectedGame]="selectedGame" [meReady]="(me$ | async)?.isReady || false"
                                        [isScreen]="(me$ | async)?.isScreen || false" (toggleReady)="toggleReady($event)">
                                    </app-player-settings>
                                </div>
                            </div>
                        </div>
                    </ng-container>
        </div>
        <!-- ACTIVE GAME STATE -->
        <div *ngIf="!needsName && (gameStarted$ | async)" class="h-100 w-100 fade-in position-relative d-flex flex-column">

            <div class="flex-grow-1 position-relative overflow-hidden">
                <ng-container *ngIf="gameComponent" 
                              [ngComponentOutlet]="gameComponent" 
                              [ngComponentOutletInputs]="gameInputs">
                </ng-container>

                <!-- Fallback removed: All games should have explicit components now -->
                <div *ngIf="!gameComponent"
                    class="h-100 d-flex flex-column align-items-center justify-content-center text-secondary">
                    <i class="bi bi-exclamation-triangle fs-1 mb-2"></i>
                    <p>Game component not found for {{ (currentRoom$ | async)?.gameType }}</p>
                </div>
            </div>

            <!-- INTERMISSION SETTINGS BAR (Host Only - Desktop) -->
            <div *ngIf="(isIntermission$ | async) && (isHost$ | async)"
                class="intermission-bar position-absolute bottom-0 start-0 w-100 p-3 shadow-lg border-top border-secondary d-none d-md-block"
                style="background-color: var(--surface-card); box-shadow: 0 -5px 20px rgba(0,0,0,0.3) !important;">
                <div class="container-fluid d-flex align-items-center justify-content-center">
                    <app-host-settings [roomCode]="roomCode" [compactMode]="true" [isIntermission]="true"
                        [currentGameType]="(currentRoom$ | async)?.gameType || ''"
                        [currentRound]="(currentRoom$ | async)?.roundNumber || 0"
                        [totalRounds]="(currentRoom$ | async)?.totalRounds || (currentRoom$ | async)?.settings?.totalRounds || 5"
                        [players]="(players$ | async) || []"
                        (nextRound)="onNextRound($event)" (endGame)="onEndGame($event)" (exitGame)="onExitGame($event)">
                    </app-host-settings>
                </div>
            </div>

            <!-- HOST CONTROLS (Mobile Only - Bottom of Game View) -->
            <div class="d-md-none bg-surface border-top border-pink p-3" *ngIf="(isHost$ | async)">
                 <!-- Toggle for Host Controls if they take up too much space? For now, just show them as requested -->
                 <details class="mb-2">
                    <summary class="btn btn-outline-warning w-100 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-star-fill"></i> Host Controls
                    </summary>
                    <div class="mt-3 card shadow-sm border-warning">
                        <div class="card-body p-3">
                            <!-- Dynamic Host Controls from Active Game -->
                            <div *ngIf="activeGameComponent?.hostControlsTemplate" class="mb-3 border-bottom pb-3">
                                <ng-container *ngTemplateOutlet="activeGameComponent.hostControlsTemplate"></ng-container>
                            </div>

                            <app-host-settings [roomCode]="roomCode" [compactMode]="true"
                                [currentGameType]="(currentRoom$ | async)?.gameType || ''"
                                [meReady]="(me$ | async)?.isReady || false" [isHost]="(isHost$ | async) || false"
                                [isScreen]="(me$ | async)?.isScreen || false"
                                [isHostOverride]="(currentRoom$ | async)?.isHostOverride || false"
                                (gameStart)="startGame($event)"
                                (nextRound)="onNextRound($event)" (endGame)="onEndGame($event)" (exitGame)="onExitGame($event)"
                                (toggleReady)="toggleReady($event)">
                            </app-host-settings>
                        </div>
                    </div>
                 </details>
            </div>
        </div>
    </div>

    <!-- PLAYER VIEW -->
    <ng-template #playerView>
        <div class="d-flex flex-column justify-content-center h-100">
            <!-- Dynamic Game Component -->
            <ng-container *ngIf="gameComponent">
                <ng-container *ngComponentOutlet="gameComponent; inputs: gameInputs"></ng-container>
            </ng-container>

            <div *ngIf="!gameComponent"
                class="h-100 d-flex flex-column align-items-center justify-content-center text-secondary">
                <p>Game component not found.</p>
            </div>
        </div>
    </ng-template>

</div>

<!-- 3. MOBILE TAB BAR (Small Screens Only) -->
<app-mobile-tab-bar *ngIf="!needsName" [activeTab]="mobileView" [isHost]="(isHost$ | async) || false"
    (tabChange)="setMobileView($event)">
</app-mobile-tab-bar>
