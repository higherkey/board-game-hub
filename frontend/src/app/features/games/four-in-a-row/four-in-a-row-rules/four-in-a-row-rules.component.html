<section class="rules" aria-label="How to play Four in a Row">
    <p>Two players take turns dropping a disc into one of seven columns. Each disc falls to the lowest empty space.</p>
    <p>Connect four discs horizontally, vertically, or diagonally to win. A full board with no winner is a draw. Red (1) goes first; Yellow (2) goes second.</p>
    <button type="button" (click)="closeRules.emit()">Close rules</button>
</section>
