<section class="four-game">
    <header>
        <h2>Four in a Row</h2>
        <button type="button" (click)="showRules = !showRules" [attr.aria-expanded]="showRules">{{ showRules ? 'Hide rules' : 'How to play' }}</button>
    </header>
    <app-four-in-a-row-rules *ngIf="showRules" (closeRules)="showRules = false" />
    <p class="status" role="status" aria-live="polite">{{ status }}</p>
    <div class="players" aria-label="Players">
        <span *ngFor="let id of room?.gameData?.playerOrder; let index = index"
            [class.active]="id === room?.gameData?.currentPlayerId">
            <strong>{{ index === 0 ? 'Red · 1' : 'Yellow · 2' }}</strong> {{ playerName(id) }}{{ id === myConnectionId ? ' (you)' : '' }}
        </span>
    </div>
    <app-four-in-a-row-board *ngIf="isScreen" [room]="room" />
    <app-four-in-a-row-player *ngIf="!isScreen" [room]="room" [myConnectionId]="myConnectionId" (columnDrop)="drop($event)" />
    <p class="end-hint" *ngIf="room?.gameData?.phase === 'GameOver'">Use the room controls to play again or return to the lobby.</p>
</section>
