<!-- Four in a Row: the rack is the game. A Table shows it as large as the screen allows, with who is who beside it. -->
<section class="four-game" [class.is-table]="isScreen">
    <div class="four-stage">
        <app-four-in-a-row-board *ngIf="isScreen" [room]="room" />
        <app-four-in-a-row-player *ngIf="!isScreen" [room]="room" [myConnectionId]="myConnectionId" (columnDrop)="drop($event)" />
    </div>
    <app-tableau-ring class="four-players" [entries]="entries" label="Players"></app-tableau-ring>
</section>

<ng-template #rules><app-four-in-a-row-rules /></ng-template>
