<div class="pictophone-hand-container h-100 d-flex flex-column p-3 overflow-auto" *ngIf="room?.gameData as state">
    <!-- Header & Host Controls -->
    <div class="card shadow-sm mb-3 border-0 bg-surface-3">
        <div class="card-body d-flex justify-content-between align-items-center p-2 px-3">
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-primary">Round {{ (state.roundIndex || 0) + 1 }}</span>
                <span class="badge bg-info text-dark">{{ getPhaseLabel(state.phase) }}</span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <div *ngIf="room?.roundEndTime && state.phase !== 'Reveal'"
                    class="d-flex align-items-center gap-1 px-2 py-1 rounded border bg-surface-2"
                    [class.text-danger]="(timeLeft$ | async)! < 10">
                    <i class="bi bi-clock-fill"></i>
                    <span class="fw-bold">{{ timeLeft$ | async }}s</span>
                </div>

                <div *ngIf="isHost && state.phase !== 'Reveal'" class="btn-group btn-group-sm">
                    <button class="btn btn-warning" (click)="pauseGame()" *ngIf="!room?.isPaused" title="Pause">
                        <i class="bi bi-pause-fill"></i>
                    </button>
                    <button class="btn btn-success" (click)="resumeGame()" *ngIf="room?.isPaused" title="Resume">
                        <i class="bi bi-play-fill"></i>
                    </button>
                    <button class="btn btn-danger" (click)="forceNext()" title="Skip Phase">
                        <i class="bi bi-fast-forward-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME CONTENT -->
    <div class="flex-grow-1 overflow-auto d-flex flex-column">
        <!-- PROMPTING / GUESSING PHASE -->
        <ng-container *ngIf="state.phase === 'Prompting' || state.phase === 'Guessing'">
            <app-pictophone-input [phase]="state.phase" [previousPage]="getPreviousPage(state)"
                [timeLeft]="timeLeft$ | async" (submitted)="onSubmit($event)" (draftChanged)="onDraftChanged($event)">
            </app-pictophone-input>
        </ng-container>

        <!-- DRAWING PHASE -->
        <ng-container *ngIf="state.phase === 'Drawing'">
            <app-pictophone-drawing [prompt]="getPreviousPage(state)?.content" [timeLeft]="timeLeft$ | async"
                (imageSubmitted)="onSubmit($event)" (draftChanged)="onDraftChanged($event)">
            </app-pictophone-drawing>
        </ng-container>

        <!-- REVEAL PHASE -->
        <ng-container *ngIf="state.phase === 'Reveal'">
            <app-pictophone-results [books]="state.books" [isHost]="isHost" [myConnectionId]="myConnectionId"
                [showcaseBookIndex]="state.showcaseBookIndex" [showcasePageIndex]="state.showcasePageIndex"
                (starPage)="onStarPage($event)" (revealNext)="onRevealNext()">
            </app-pictophone-results>
        </ng-container>

        <!-- WAITING / LOBBY -->
        <div *ngIf="state.phase === 'Lobby'" class="alert alert-info py-4 text-center">
            <h4 class="fw-bold">Waiting for host to start...</h4>
            <p class="text-muted m-0">Prepare your drawing fingers!</p>
        </div>
    </div>
</div>
