<!-- Farkle's Table: the dice tray is the hero, with scores and the scoring guide in reach beside it. -->
<div class="farkle-table" *ngIf="state">
  <section class="farkle-scores" aria-label="Scores">
    <h2 class="farkle-label">Scores</h2>
    <app-tableau-ring [entries]="entries" label="Scores"></app-tableau-ring>
  </section>

  <div class="farkle-stage">
    <p class="farkle-at-risk" *ngIf="state.currentTurnScore > 0 && state.phase !== 'GameOver'">
      <span class="farkle-at-risk-value">{{ state.currentTurnScore | number }}</span>
      <span>at risk this turn</span>
    </p>

    <!-- The server rolls; the tray throws only when the roll id changes, so a refresh never replays a throw. -->
    <app-dice-tray class="farkle-table-tray" [dice]="trayDice(state.dice)" [rollId]="state.rollId ?? null"
      motion="full" label="Dice on the table" (settled)="landing.land(state.rollId)"></app-dice-tray>

    <div class="farkle-announce" *ngIf="landing.phase(state) === 'Farkled'" role="alert">
      <span class="farkle-burst">Farkle!</span>
    </div>
    <div class="farkle-announce" *ngIf="state.phase === 'GameOver'" role="alert">
      <span class="farkle-burst farkle-burst--win">{{ status }}</span>
    </div>
  </div>

  <section class="farkle-guide" aria-label="Scoring guide">
    <h2 class="farkle-label">How it scores</h2>
    <app-farkle-rules></app-farkle-rules>
  </section>
</div>

<ng-template #rules><app-farkle-rules></app-farkle-rules></ng-template>
