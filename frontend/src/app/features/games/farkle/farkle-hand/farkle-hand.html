<!-- Farkle's Hand: my dice up top, the turn's tension in the middle, Roll and Bank in thumb reach. -->
<div class="farkle-hand" *ngIf="state">
  <div class="dice-tray-area">
    <app-dice-tray [dice]="trayDice(state.dice)" [rollId]="state.rollId ?? null" motion="short" [aspect]="4 / 3"
      [selectable]="myConnectionId === state.activePlayerId" (dieToggle)="toggleDie($event)"
      (settled)="landing.land(state.rollId)" label="Your dice. Tap one to keep it."></app-dice-tray>
  </div>

  <section class="farkle-hand-scores" aria-label="Scores">
    <app-tableau-ring [entries]="entries"></app-tableau-ring>
  </section>

  <!-- aria-live announces phase changes to screen readers -->
  <div aria-live="assertive" aria-atomic="true" class="sr-only">
    <ng-container [ngSwitch]="landing.phase(state)">
      <span *ngSwitchCase="'Farkled'">Farkle! The turn scores nothing.</span>
      <span *ngSwitchCase="'Rolling'">Dice are rolling.</span>
      <span *ngSwitchCase="'Banked'">Points banked.</span>
    </ng-container>
  </div>

  <ng-container *ngIf="myConnectionId === state.activePlayerId" [ngSwitch]="landing.phase(state)">
    <p *ngSwitchCase="'Rolling'" class="phase-msg">Rolling…</p>
    <p *ngSwitchCase="'Farkled'" class="phase-msg farkle">Farkle!</p>
    <p *ngSwitchCase="'Banked'" class="phase-msg banked">Banked</p>
  </ng-container>

  <app-action-dock *ngIf="myConnectionId === state.activePlayerId && landing.phase(state) === 'Picking'">
    <button type="button" class="farkle-btn roll" (click)="roll()">
      {{ getRollCount() > 0 ? 'Roll ' + getRollCount() + ' dice' : 'Roll all six' }}
    </button>
    <button type="button" class="farkle-btn bank" [disabled]="state.currentTurnScore === 0" (click)="bank()">
      Bank {{ state.currentTurnScore | number }}
    </button>
  </app-action-dock>
</div>

<ng-template #rules><app-farkle-rules></app-farkle-rules></ng-template>
