name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Install Backend Dependencies
        run: dotnet restore backend/BoardGameHub.sln

      - name: Begin Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"higherkey_board-game-hub" \
            /o:"higherkey" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="${{ github.workspace }}/frontend/coverage/frontend/lcov.info" \
            /d:sonar.sources="backend/BoardGameHub.Api,frontend/src" \
            /d:sonar.exclusions="**/node_modules/**,**/obj/**,**/bin/**,**/*.spec.ts,backend/BoardGameHub.Tests/**" \
            /d:sonar.projectBaseDir="${{ github.workspace }}"

      - name: Run Frontend Tests & Coverage
        run: |
          npm --prefix frontend test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadless
          sed -i 's|SF:src/|SF:frontend/src/|g' frontend/coverage/frontend/lcov.info

      - name: Build Backend (Required for accurate C# analysis)
        run: dotnet build backend/BoardGameHub.sln --no-restore

      - name: Run Backend Tests & Coverage
        run: |
          dotnet test backend/BoardGameHub.Tests/BoardGameHub.Tests.csproj \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput="${{ github.workspace }}/coverage.opencover.xml"

      - name: End Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
