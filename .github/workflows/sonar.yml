name: SonarQube Analysis

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    types: [opened, synchronize, reopened]


jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET Dependencies
        run: dotnet restore backend/BoardGameHub.sln

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frontend Install
        run: npm --prefix frontend ci

      - name: Verify diagnostic secret hygiene
        run: node --test scripts/sonar-diagnostics.test.js

      - name: Install unified .NET scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0 --allow-roll-forward

      - name: Begin unified backend and frontend analysis
        run: |
          set -euo pipefail
          dotnet sonarscanner begin /k:"higherkey_board-game-hub" /o:"higherkey" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.exclusions="**/node_modules/**,**/obj/**,**/bin/**,**/*.spec.ts,backend/BoardGameHub.Tests/**,frontend/e2e/**,frontend/dist/**,frontend/coverage/**,**/wwwroot/**,scripts/**,docs/**,.github/**,frontend/playwright*.ts" \
            /d:sonar.coverage.exclusions="**/Migrations/**,backend/BoardGameHub.Api/Program.cs,**/*.spec.ts,backend/BoardGameHub.Api/Models/Dtos/**,backend/BoardGameHub.Api/Services/ScatterbrainData.cs,backend/BoardGameHub.Api/Services/RoomService.cs" \
            /d:sonar.cpd.exclusions="**/*.spec.ts,**/*.html" \
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="frontend/coverage/frontend/lcov.info" \
            /d:sonar.qualitygate.wait=true /d:sonar.qualitygate.timeout=300

      - name: Backend Build, Tests and Coverage
        run: |
          set -euo pipefail
          dotnet build backend/BoardGameHub.sln --no-incremental --disable-build-servers -c Release
          dotnet test backend/BoardGameHub.Tests/BoardGameHub.Tests.csproj --no-build -c Release \
            /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=../../coverage.opencover.xml

      - name: Frontend Tests & Coverage
        run: |
          npm --prefix frontend test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadless

      - name: Finish analysis and enforce quality gate
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report current and dev reliability findings
        if: always()
        env:
          SONAR_PR: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.ref_name }}
        run: node scripts/sonar-diagnostics.js



