name: Deploy Frontend to Vercel

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && (github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development')) || 'development' }}
      url: ${{ github.event_name == 'push' && github.ref_name == 'main' && 'https://board-game-hub-alpha.vercel.app' || steps.deploy.outputs.preview-url }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            npm run build -- --configuration=production
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "staging" ]; then
            npm run build -- --configuration=staging
          else
            npm run build -- --configuration=development
          fi

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: ${{ github.event_name == 'push' && github.ref_name == 'main' && '--prod' || '' }}
          github-comment: true

