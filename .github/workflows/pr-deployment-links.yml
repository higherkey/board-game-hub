name: PR Comment Deployment Links

permissions:
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  comment-deployment-links:
    name: Deployment Preview Links
    runs-on: ubuntu-latest
    steps:
      - name: Add or Update Deployment Links Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const header = '### 🚀 Environment Deployment & Preview Links';
            const body = `${header}

            | Environment | Frontend URL | Backend API URL |
            | :--- | :--- | :--- |
            | **Development (\`dev\`)** | [dev.board-game-hub-frontend.pages.dev](https://dev.board-game-hub-frontend.pages.dev) | [board-game-hub-api-dev.onrender.com](https://board-game-hub-api-dev.onrender.com) |
            | **Staging (\`staging\`)** | [staging.board-game-hub-frontend.pages.dev](https://staging.board-game-hub-frontend.pages.dev) | [board-game-hub-api-staging.onrender.com](https://board-game-hub-api-staging.onrender.com) |
            | **Production (\`main\`)** | [boardgamehub.eight1fivedesign.com](https://boardgamehub.eight1fivedesign.com) | [board-game-hub-api.onrender.com](https://board-game-hub-api.onrender.com) |

            > *Deployments to \`dev\` trigger automatically once this pull request is merged.*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(c => c.body.includes(header));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body
              });
            }
