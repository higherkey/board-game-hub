name: Cleanup Branch Notes on Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cleanup-branch-notes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    name: Prune Branch Notes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune branch notes files on main
        run: |
          if [ -d "docs/branch-notes" ]; then
            echo "Pruning transient branch notes on main..."
            find docs/branch-notes/ -mindepth 1 -type f ! -name '.gitkeep' -delete
            find docs/branch-notes/ -mindepth 1 -type d -empty -delete
            touch docs/branch-notes/.gitkeep
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain docs/branch-notes/) ]]; then
            git add docs/branch-notes/
            git commit -m "chore(docs): Clean up branch notes on main [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No branch notes to clean up on main."
          fi
