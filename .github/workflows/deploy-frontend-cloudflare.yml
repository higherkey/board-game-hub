name: Deploy Frontend to Cloudflare Pages

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development') }}
      url: ${{ github.ref_name == 'main' && 'https://boardgamehub.eight1fivedesign.com' || (github.ref_name == 'staging' && 'https://staging.board-game-hub-frontend.pages.dev' || 'https://dev.board-game-hub-frontend.pages.dev') }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            npm run build -- --configuration=production
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "staging" ]; then
            npm run build -- --configuration=staging
          else
            npm run build -- --configuration=development
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'board-game-hub-frontend'
          directory: 'frontend/dist/frontend/browser'
          branch: ${{ github.head_ref || github.ref_name }}
