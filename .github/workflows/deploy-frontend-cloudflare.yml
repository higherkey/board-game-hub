name: Deploy Frontend to Cloudflare Pages

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  pull_request:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development')) }}
      url: ${{ steps.deploy.outputs.deployment_url }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            npm run build -- --configuration=production
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "staging" ]; then
            npm run build -- --configuration=staging
          else
            npm run build -- --configuration=development
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deploy and capture output
          DEPLOY_OUTPUT=$(npx wrangler pages deploy dist/frontend/browser --project-name=board-game-hub-frontend --branch=${{ github.head_ref || github.ref_name }})
          echo "$DEPLOY_OUTPUT"

          # Extract deployment URL (e.g., https://abc12345.board-game-hub-frontend.pages.dev)
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -n 1)

          if [ -z "$DEPLOY_URL" ]; then
            # Fallback to branch-based pages.dev subdomain if specific hash regex did not match
            CLEAN_BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | cut -c 1-28)
            DEPLOY_URL="https://${CLEAN_BRANCH}.board-game-hub-frontend.pages.dev"
          fi

          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment PR Deployment Preview
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment_url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const commitSha = '${{ github.event.pull_request.head.sha }}'.substring(0, 7);
            const header = '### 🚀 PR Preview Deployment Ready';
            const commentBody = `${header}

            | Preview | Link |
            | :--- | :--- |
            | **Frontend Deployment** | [${deployUrl}](${deployUrl}) |
            | **Commit** | \`${commitSha}\` |

            > *Preview deployment updated automatically on new commits to this pull request.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(c => c.body.includes(header));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
            }
