name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.AZURE_REGISTRY_USERNAME }}
  REGISTRY: ${{ secrets.AZURE_REGISTRY_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        id: build_image
        run: |
          TAG=${{ github.ref_name }}
          IMAGE_NAME=${{ env.REGISTRY }}/board-game-hub-api:$TAG
          docker build -t $IMAGE_NAME -f backend/Dockerfile backend/
          docker push $IMAGE_NAME
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Determine Secrets
        id: determine_secrets
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
             echo "db_connection=${{ secrets.SUPABASE_CONNECTION_STRING_PROD }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
             echo "db_connection=${{ secrets.SUPABASE_CONNECTION_STRING_DEV }}" >> "$GITHUB_OUTPUT"
          else
             echo "Error: Branch '${{ github.ref_name }}' is not supported for backend deployment."
             exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply Database Migrations
        run: |
          dotnet ef migrations bundle --project backend/BoardGameHub.Api --force
          ./efbundle --connection "${{ steps.determine_secrets.outputs.db_connection }}"


      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: boardgamehubacr
          containerAppName: ${{ github.ref_name == 'main' && 'board-game-hub-api' || 'board-game-hub-api-dev' }}
          resourceGroup: board-game-hub-rg
          imageToDeploy: ${{ steps.build_image.outputs.image_name }}
          targetPort: 8080
          environmentVariables: "ConnectionStrings__DefaultConnection=${{ steps.determine_secrets.outputs.db_connection }}"
