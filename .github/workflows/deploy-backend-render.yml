name: Deploy Backend to Render

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'scripts/render-deploy*'
      - 'scripts/api-binding.test.js'
      - 'scripts/normalize-connection-string.js'
      - '.github/workflows/deploy-backend-render.yml'
  pull_request:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'scripts/render-deploy*'
      - 'scripts/api-binding.test.js'
      - 'scripts/normalize-connection-string.js'
      - '.github/workflows/deploy-backend-render.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/BoardGameHub.sln

      - name: Build Backend
        run: dotnet build backend/BoardGameHub.sln --no-restore -c Release

      - name: Run Backend Tests
        run: dotnet test backend/BoardGameHub.Tests/BoardGameHub.Tests.csproj --no-build -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test deployment guardrails
        env:
          BGH_API_DLL: backend/BoardGameHub.Api/bin/Release/net10.0/BoardGameHub.Api.dll
        run: node --test scripts/render-deploy.test.js scripts/api-binding.test.js

  deploy:
    name: Apply Migrations & Deploy
    needs: test-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development') }}
      url: ${{ github.ref_name == 'main' && 'https://board-game-hub-api.onrender.com' || (github.ref_name == 'staging' && 'https://board-game-hub-api-staging.onrender.com' || 'https://board-game-hub-api-dev.onrender.com') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/BoardGameHub.sln

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Determine Target Environment & DB Connection
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          PROD_CONNECTION: ${{ secrets.SUPABASE_CONNECTION_STRING_PROD }}
          STAGING_CONNECTION: ${{ secrets.SUPABASE_CONNECTION_STRING_STAGING }}
          DEV_CONNECTION: ${{ secrets.NEON_CONNECTION_STRING_DEV }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY is required to align and verify the deployment}"
          case "$TARGET_BRANCH" in
            main) DB_CONN="$PROD_CONNECTION" ;;
            staging) DB_CONN="$STAGING_CONNECTION" ;;
            dev) DB_CONN="$DEV_CONNECTION" ;;
            *) echo "::error::Unsupported deployment branch"; exit 1 ;;
          esac
          if [ -z "$DB_CONN" ] || [[ "$DB_CONN" == *$'\n'* ]] || [[ "$DB_CONN" == *$'\r'* ]]; then
            echo "::error::A single-line database connection is required for this tier. No fallback is allowed."
            exit 1
          fi
          echo "::add-mask::$DB_CONN"
          printf 'RAW_CONNECTION_STRING=%s\n' "$DB_CONN" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize DB Connection String
        run: |
          set -euo pipefail
          NORMALIZED=$(node scripts/normalize-connection-string.js)
          echo "::add-mask::$NORMALIZED"
          printf 'NORMALIZED_CONNECTION=%s\n' "$NORMALIZED" >> "$GITHUB_ENV"

      - name: Apply Database Migrations
        env:
          Jwt__Key: "TemporaryCiBuildTimeDesignKeyForEfCoreMigrations1234567890!"
          DOTNET_ENVIRONMENT: "Production"
        run: |
          set -euo pipefail
          export ConnectionStrings__DefaultConnection="$NORMALIZED_CONNECTION"
          dotnet ef migrations bundle --project backend/BoardGameHub.Api --force
          chmod +x ./efbundle
          ./efbundle --connection "$NORMALIZED_CONNECTION"


      - name: Align Render database, deploy and verify
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_NAME: ${{ github.ref_name == 'main' && 'board-game-hub-api' || (github.ref_name == 'staging' && 'board-game-hub-api-staging' || 'board-game-hub-api-dev') }}
          TARGET_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/render-deploy.js
