name: Keep Supabase Alive

permissions:
  contents: read

on:
  schedule:
    - cron: '30 5 * * *' # Run daily at a random-ish time (5:30 AM)
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          DEV_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
        run: |
          for PROJ_ID in "$PROD_PROJECT_ID" "$DEV_PROJECT_ID"; do
            if [ -z "$PROJ_ID" ]; then
              continue
            fi
            echo "Processing Supabase project: $PROJ_ID"
            
            KEYS_JSON=$(curl -s -f "https://api.supabase.com/v1/projects/${PROJ_ID}/api-keys" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
            
            ANON_KEY=$(echo "$KEYS_JSON" | jq -r '.[] | select(.name=="anon") | .api_key')
            
            if [ -n "$ANON_KEY" ] && [ "$ANON_KEY" != "null" ]; then
              echo "Pinging REST API for $PROJ_ID..."
              curl -s -i -X GET "https://${PROJ_ID}.supabase.co/rest/v1/Games?select=Id&limit=1" \
                -H "apikey: ${ANON_KEY}" \
                -H "Authorization: Bearer ${ANON_KEY}"
            else
              echo "Warning: Could not retrieve anon key for $PROJ_ID"
            fi
          done

