services:
  - type: web
    name: board-game-hub-api
    branch: main
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon 
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false # Set in Render Dashboard (Neon Prod)
      - key: Jwt__Key
        sync: false # Set in Render Dashboard
      - key: TurnServer__Url
        sync: false # Set in Render Dashboard
      - key: TurnServer__Username
        sync: false # Set in Render Dashboard
      - key: TurnServer__Credential
        sync: false # Set in Render Dashboard

  - type: web
    name: board-game-hub-api-dev
    branch: dev
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon 
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ConnectionStrings__DefaultConnection
        sync: false # Set in Render Dashboard (Neon Dev)
      - key: Jwt__Key
        sync: false # Set in Render Dashboard
      - key: TurnServer__Url
        sync: false # Set in Render Dashboard
      - key: TurnServer__Username
        sync: false # Set in Render Dashboard
      - key: TurnServer__Credential
        sync: false # Set in Render Dashboard

  - type: web
    name: board-game-hub-api-staging
    branch: staging
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon 
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ConnectionStrings__DefaultConnection
        sync: false # Set in Render Dashboard (Neon Staging / Dev fallback)
      - key: Jwt__Key
        sync: false # Set in Render Dashboard
      - key: TurnServer__Url
        sync: false # Set in Render Dashboard
      - key: TurnServer__Username
        sync: false # Set in Render Dashboard
      - key: TurnServer__Credential
        sync: false # Set in Render Dashboard

